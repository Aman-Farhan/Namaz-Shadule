<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Namaz Schedule</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Islam Namaz</h1>
    <h2 class="namaz">Namaz Schedule</h2>
  </header>

  <main>
    <!-- Fajr -->
    <section class="prayer">
      <h3>Fajer</h3>
      <ul>
        <li>2 Sunnat</li>
        <li>2 Farz</li>
      </ul>
    </section>

    <!-- Zuhar -->
    <section class="prayer">
      <h3>Zuhar</h3>
      <ul>
        <li>4 Sunnat</li>
        <li>4 Farz</li>
        <li>2 Sunnat</li>
        <li>2 Nafl</li>
      </ul>
    </section>

    <!-- Asr -->
    <section class="prayer">
      <h3>Aser</h3>
      <ul>
        <li>4 Sunnat</li>
        <li>4 Farz</li>
      </ul>
    </section>

    <!-- Maghrib -->
    <section class="prayer">
      <h3>Maghrib</h3>
      <ul>
        <li>3 Farz</li>
        <li>2 Sunnat</li>
        <li>2 Nafl</li>
      </ul>
    </section>

    <!-- Isha -->
    <section class="prayer">
      <h3>Isha</h3>
      <ul>
        <li>4 Sunnat</li>
        <li>4 Farz</li>
        <li>2 Sunnat</li>
        <li>2 Nafl</li>
        <li>3 Witr</li>
        <li>2 Nafl</li>
      </ul>
    </section>
  </main>

</body>
</html>
